version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: aniverse-db
    restart: always
    environment:
      POSTGRES_USER: aniverse_user
      POSTGRES_PASSWORD: aniverse_password
      POSTGRES_DB: aniverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aniverse_user -d aniverse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aniverse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
